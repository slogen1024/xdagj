# Shipped devnet plus node-local listen addresses. Same consensus defaults as pool-a.
admin.telnet.ip = 0.0.0.0
admin.telnet.port = 6001
admin.telnet.password = root

pool.ws.port = 7001

node.ip = pool-c
node.port = 8001
node.tag = xdagj-pool-c
node.maxInboundConnectionsPerIp = 8
node.whiteIPs = ["pool-a:8001","pool-b:8001","pool-c:8001"]
node.generate.block.enable = true

node.transaction.history.enable = false

rpc.http.enabled = true
rpc.http.host = 0.0.0.0
rpc.http.port = 10001
rpc.ws.port = 10002

randomx.flags.fullmem = false

# The executable jar rejects a conf that omits this. Same default as AbstractConfig.
fund.address = "4duPWMbYUgAifVYkKDCWxLvRRkSByf5gb"

# Both chains. An explicit list together with subscribeAll is refused at startup.
chain.subscribeAll = true
