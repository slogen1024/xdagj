# Admin Config
admin.telnet.ip = 127.0.0.1
admin.telnet.port = 6001
admin.telnet.password = root

# Node Config
node.ip = 127.0.0.1
node.port = 8001
node.maxInboundConnectionsPerIp = 8
node.whiteIPs = ["127.0.0.1:8001","127.0.0.1:8002"]

node.transaction.history.pageSizeLimit = 888

# Node RPC Config
rpc.http.enabled = true
rpc.http.host = 127.0.0.1
rpc.http.port = 10001
rpc.ws.enabled = true
rpc.ws.host = 127.0.0.1
rpc.ws.port = 10002
# Foundation fund (fund.address is required since the S-36 hardening; test placeholder)
fund.address = "PKcBtHWDSnAWfZntqWPBLedqBShuKSTzS"
fund.ration = 5

# Embedded EVM (sub-project B; provisional devnet chain id 0xCAFE)
evm.enabled = true
evm.activationHeight = 0
# Keep in sync with src/main/resources/xdag-devnet.conf — this classpath copy wins per-key in tests.
evm.batchActivationHeight = 0
# Type-2 (EIP-1559) txs activate at genesis on devnet; testnet/mainnet omit it (= not scheduled).
evm.type2ActivationHeight = 0
# XDAG<->EVM bridge (defect-3 phase 3a): deposits activate at genesis on devnet; testnet/mainnet
# omit it (= not scheduled). The recovery address receives mints whose remark cannot be decoded
# (consensus value - all nodes must agree). Devnet uses the funded test address.
# Keep in sync with src/main/resources/xdag-devnet.conf — this classpath copy wins per-key in tests.
evm.bridgeActivationHeight = 0
# Keep in sync with src/main/resources/xdag-devnet.conf — this classpath copy wins per-key in tests.
evm.invalidTxSkipActivationHeight = 0
evm.bridgeRecoveryAddress = "0x7e5f4552091a69125d5dfcb7b8c2659029395bdf"
# Withdrawal maturation delay N in main blocks (spec §3.2): devnet 2 (~2 min); recommend 16 for shared nets.
evm.bridgeWithdrawalDelay = 2
evm.chainId = 51966
# Non-binding by user directive (see main conf): MAX_BATCH_TXS and cadence are the real bounds.
evm.blockGasLimit = 1000000000000
evm.txPoolTtlSeconds = 3600
evm.maxP2pTxBytes = 131072
evm.minGasPrice = 1

evm.maxLogScanRange = 1024
# C4: recent heights whose historical world state a block-tag query can read (archive beyond this is unavailable).
evm.stateHistoryWindow = 128
