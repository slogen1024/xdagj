# Admin Config
admin.telnet.ip = 127.0.0.1
admin.telnet.port = 6001
admin.telnet.password = root

# Pool Config
pool.ws.port = 7001

# Node config
node.ip = 127.0.0.1
node.port = 8001
node.tag = xdagj-node-1
node.maxInboundConnectionsPerIp = 8
node.whiteIPs = ["127.0.0.1:8001","127.0.0.1:8002"]
node.generate.block.enable = true

# Node transaction history config
node.transaction.history.enable = false

# Node RPC Config
rpc.http.enabled = true
rpc.http.host = 127.0.0.1
rpc.http.port = 10001
rpc.ws.enabled = true
rpc.ws.host = 127.0.0.1
rpc.ws.port = 10002
# Allow local-explorer (and other localhost static pages) to call RPC from the browser
rpc.http.corsOrigins = "*"

# Randomx Config
randomx.flags.fullmem = false
# Foundation fund (required since S-36; replace with the real foundation address for this network)
fund.address = "PKcBtHWDSnAWfZntqWPBLedqBShuKSTzS"
fund.ration = 5

# Embedded EVM (sub-project B; provisional devnet chain id 0xCAFE)
evm.enabled = true
evm.activationHeight = 0
evm.chainId = 51966
evm.blockGasLimit = 30000000
evm.txPoolTtlSeconds = 3600
evm.maxP2pTxBytes = 131072
evm.minGasPrice = 1

evm.maxLogScanRange = 1024
# C4: recent heights whose historical world state a block-tag query can read (archive beyond this is unavailable).
evm.stateHistoryWindow = 128

# Funding on-ramp: pre-fund the standard test address (private key 1) with 1,000,000 wei-tokens so
# gas settlement and value transfers are usable on devnet out of the box. Testnet/mainnet fund nothing.
evm.alloc = [
  { address = "0x7e5f4552091a69125d5dfcb7b8c2659029395bdf", balance = "1000000000000000000000000" }
]
