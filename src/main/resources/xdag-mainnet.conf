# Randomx Config
randomx.flags.fullmem = false
# ── Embedded EVM (smart contracts) ─────────────────────────────────────────────
# Scaffolded but NOT activated on this shared network. Enabling (evm.enabled = true) is gated on the
# §13.3 hard gates — see .claude/docs/evm-mainnet-readiness-and-audit-scope.md.
evm.enabled = false
# Reserved EIP-155 chain id (0xCAFC). Confirm no collision on ethereum-lists/chains before launch.
evm.chainId = 51964
# Hard-fork gates — all UNSCHEDULED (Long.MAX_VALUE). evm.activationHeight is pinned to MAX_VALUE
# (not the field default 0) so a future evm.enabled=true flip cannot silently activate at height 0;
# set the real heights when each fork is coordinated.
evm.activationHeight = 9223372036854775807
evm.batchActivationHeight = 9223372036854775807
evm.type2ActivationHeight = 9223372036854775807
evm.bridgeActivationHeight = 9223372036854775807
evm.eip3529ActivationHeight = 9223372036854775807
evm.feeRewardActivationHeight = 9223372036854775807
evm.stateRootActivationHeight = 9223372036854775807
evm.stateRootLag = 16
evm.stateRootHardReject = true
# Gas / anti-spam / DoS bounds (framework defaults shown). blockGasLimit and minGasPrice are the real
# consensus/economic values that MUST be reviewed before enabling — EVM execution is synchronous in setMain.
evm.blockGasLimit = 30000000
evm.minGasPrice = 1000000000
evm.txPoolTtlSeconds = 3600
evm.maxP2pTxBytes = 131072
evm.maxLogScanRange = 1024
# C4: recent heights whose historical world state a block-tag query can read (archive beyond this is unavailable).
evm.stateHistoryWindow = 128
