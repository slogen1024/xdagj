[package]
name = "xdag-contract"
version = "0.1.0"
edition = "2021"
description = "ABI, memory host, and the three reference contracts for the XDAG chain protocol"
license = "MIT"

[dependencies]
k256 = { version = "0.13", features = ["ecdsa"] }
ripemd = "0.1"
sha2 = "0.10"
xdag = { path = "macros" }

[[bin]]
name = "sign-call"
path = "src/bin/sign-call.rs"

[[bin]]
name = "sign-ext"
path = "src/bin/sign-ext.rs"
